spring.config.import=optional:file:.env[.properties]

spring.application.name=AssetFlowApi
#spring.profiles.default=dev

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=${SPRING_LIQUIBASE_CHANGELOG}

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${APP_MAIL_FROM:no-reply@assetflow.local}

# Email verification
app.verification.token-ttl-hours=${APP_VERIFICATION_TOKEN_TTL_HOURS:24}
app.verification.link-base=${APP_VERIFICATION_LINK_BASE:${FRONTEND_URL:http://localhost:3000}/verify-email}
app.verification.enabled=${APP_VERIFICATION_ENABLED:true}
