spring.application.name=AssetFlowApi

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/af_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql = true

spring.jpa.hibernate.ddl-auto = none
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=${SPRING_LIQUIBASE_CHANGELOG:classpath:db/changelog/db.changelog-master.yaml}

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always


security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY:dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLW9ubHkh}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:3600000}
security.jwt.refresh.expiration-time=${SECURITY_JWT_REFRESH_EXPIRATION_TIME:86400000}

spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:test-client-id}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:test-client-secret}
spring.security.oauth2.client.registration.google.scope=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SCOPE:email,profile,openid}


# Optional: human-friendly name
spring.security.oauth2.client.registration.google.client-name=Google

# Enable security debug logging to inspect the authorization request and redirect_uri
logging.level.org.springframework.security=DEBUG
logging.level.liquibase=INFO

springdoc.swagger-ui.oauth.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:test-client-id}
springdoc.swagger-ui.oauth.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:test-client-secret}
springdoc.swagger-ui.oauth.scopes=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SCOPE:email,profile,openid}
springdoc.swagger-ui.oauth.use-pkce=true
springdoc.swagger-ui.oauth.redirect-url=http://localhost:8080/swagger-ui/oauth2-redirect.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

frontend.url=${FRONTEND_URL:http://localhost:3000}
ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ai.ollama.model=${OLLAMA_MODEL:tazarov/bg-gpt:latest}


app.protocol.storage=${APP_PROTOCOL_STORAGE:./data/protocols}
app.cookie.secure=${APP_COOKIE_SECURE:false}
