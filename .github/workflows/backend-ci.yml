name: Build
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AssetFlowApi
    env:
      SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL}}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME}}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD}}
      SECURITY_JWT_SECRET_KEY: ${{ secrets.SECURITY_JWT_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare Maven wrapper
        run: |
          test -f mvnw || { echo "mvnw missing in AssetFlowApi/"; exit 1; }
          sed -i 's/\r$//' mvnw
          chmod +x mvnw || true
          bash -n mvnw || true
      - name: Build
        run: bash ./mvnw -B package -DskipTests
      - name: Run tests
        run: bash ./mvnw -B test