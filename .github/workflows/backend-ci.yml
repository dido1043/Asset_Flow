name: Java CI for Backend

on:
  push:
    branches: [ "main" ]
    paths:
      - 'AssetFlowApi/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'AssetFlowApi/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: ./mvnw -B package --file AssetFlowApi/pom.xml

    - name: Run tests
      run: ./mvnw -B test --file AssetFlowApi/pom.xml